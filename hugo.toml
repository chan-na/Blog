baseURL = "https://chan-na.github.io/Blog/"
title = "chan-na's Blog"
theme = "PaperMod"

# Default language: Korean. English content lives under /en/.
defaultContentLanguage = "ko"
defaultContentLanguageInSubdir = false
hasCJKLanguage = true

enableRobotsTXT = true
enableEmoji = true
enableGitInfo = false

# Pretty URLs: /posts/my-post/ instead of /posts/my-post.html
[permalinks]
  posts = "/posts/:slug/"

[pagination]
  pagerSize = 10

# ----- Languages ---------------------------------------------------------------

[languages]
  [languages.ko]
    languageName = "한국어"
    languageCode = "ko-KR"
    weight = 1
    title = "chan-na's Blog"

    [languages.ko.params]
      description = "chan-na의 개발 블로그. 기술, 학습, 그리고 일상의 기록."
      keywords = ["블로그", "개발", "기술"]
      DateFormat = "2006-01-02"

      [languages.ko.params.homeInfoParams]
        Title = "👋 안녕하세요"
        Content = "chan-na의 개발 블로그입니다."

    [[languages.ko.menu.main]]
      identifier = "posts"
      name = "글"
      url = "/posts/"
      weight = 10

    [[languages.ko.menu.main]]
      identifier = "categories"
      name = "카테고리"
      url = "/categories/"
      weight = 20

    [[languages.ko.menu.main]]
      identifier = "tags"
      name = "태그"
      url = "/tags/"
      weight = 30

    [[languages.ko.menu.main]]
      identifier = "archives"
      name = "아카이브"
      url = "/archives/"
      weight = 40

  [languages.en]
    languageName = "English"
    languageCode = "en-US"
    weight = 2
    title = "chan-na's Blog"

    [languages.en.params]
      description = "A tech blog by chan-na — notes on engineering, learning, and life."
      keywords = ["blog", "engineering", "tech"]
      DateFormat = "2006-01-02"

      [languages.en.params.homeInfoParams]
        Title = "👋 Hello"
        Content = "chan-na's tech blog."

    [[languages.en.menu.main]]
      identifier = "posts"
      name = "Posts"
      url = "/en/posts/"
      weight = 10

    [[languages.en.menu.main]]
      identifier = "categories"
      name = "Categories"
      url = "/en/categories/"
      weight = 20

    [[languages.en.menu.main]]
      identifier = "tags"
      name = "Tags"
      url = "/en/tags/"
      weight = 30

    [[languages.en.menu.main]]
      identifier = "archives"
      name = "Archives"
      url = "/en/archives/"
      weight = 40

# ----- Theme parameters (PaperMod) --------------------------------------------

[params]
  env = "production"
  author = "chan-na"
  defaultTheme = "auto"          # auto | light | dark
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true     # copy button on code blocks
  ShowToc = true
  TocOpen = false
  ShowRssButtonInSectionTermList = true
  ShowWordCount = true
  disableSpecial1stPost = false
  comments = true                # turns on layouts/partials/comments.html
  hideMeta = false
  hideSummary = false
  showtoc = true
  tocopen = false

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/chan-na"

  [[params.socialIcons]]
    name = "email"
    url = "mailto:kimhim7025@gmail.com"

  [[params.socialIcons]]
    name = "rss"
    url = "/index.xml"

  # Giscus comments
  [params.giscus]
    repo = "chan-na/Blog"
    repoID = "R_kgDOSqVqCA"
    category = "Announcements"
    categoryID = "DIC_kwDOSqVqCM4C-BIH"
    mapping = "pathname"
    strict = "0"
    reactionsEnabled = "1"
    emitMetadata = "0"
    inputPosition = "top"
    lightTheme = "noborder_light"
    darkTheme = "noborder_dark"
    lang = ""                    # empty → partial uses the page's Site.Language.Lang (ko on /, en on /en/)
    loading = "lazy"

  [params.assets]
    disableHLJS = true            # use Hugo's built-in Chroma instead

# ----- Code highlighting (Chroma) ---------------------------------------------

[markup]
  [markup.highlight]
    style = "github"             # light theme style
    lineNos = false
    lineNumbersInTable = false
    noClasses = false            # emit CSS classes so PaperMod can theme dark/light
    codeFences = true
    guessSyntax = true
    tabWidth = 2

  [markup.goldmark.renderer]
    unsafe = true                # allow raw HTML in markdown (for embeds)

  [markup.tableOfContents]
    startLevel = 2
    endLevel = 4
    ordered = false

# ----- Outputs (RSS + JSON for search) ----------------------------------------

[outputs]
  home = ["HTML", "RSS", "JSON"]

# ----- Minification -----------------------------------------------------------

[minify]
  disableXML = true
  minifyOutput = true
